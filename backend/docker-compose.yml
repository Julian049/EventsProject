services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbit_events
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - shared_network

networks:
  shared_network:
    external: true